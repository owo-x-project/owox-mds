# Generated by mds init.
[package]
enabled = true
allow_raw_source = false

[roots]
source_md = ".mds/source"
test_md = ".mds/test"
source_out = "src"
test_out = "tests"

[authoring]
link_policy = "wiki-only"

[output]
source = "{source_out}/{module}.{ext}"
test = "{test_out}/{module}.test.{ext}"

[quality.ts]
linter = "npx --no-install prettier --check"
fixer = "npx --no-install prettier --write"
type_checker = false
test_runner = false
required = ["node", "npx"]
optional = []